{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Mantenimiento | AlCapone Family</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold: #c9a84c; --dark: #0a0804; --cream: #f5ead0; }

  body {
    min-height: 100vh;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 60% at 50% 50%, rgba(139,105,20,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 80% 20%, rgba(139,26,26,0.06) 0%, transparent 60%),
      var(--dark);
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.3;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 2;
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 4rem 3rem;
    background: rgba(18,14,8,0.95);
    border: 1px solid rgba(201,168,76,0.12);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .glyph {
    font-family: 'Cinzel Decorative', serif;
    font-size: 4rem;
    color: rgba(201,168,76,0.08);
    display: block;
    margin-bottom: 1rem;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .icon { font-size: 3rem; display: block; margin-bottom: 1.5rem; }

  .label {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.6em;
    color: rgba(201,168,76,0.5);
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: block;
  }

  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: var(--gold);
    line-height: 1.2;
    margin-bottom: 1rem;
    text-shadow: 0 0 40px rgba(201,168,76,0.2);
  }

  .rule {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.5rem auto;
  }

  .text {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: rgba(245,234,208,0.45);
    line-height: 1.9;
    margin-bottom: 2.5rem;
  }

  .firma {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    color: rgba(201,168,76,0.3);
    text-transform: uppercase;
  }

  .dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(201,168,76,0.3);
    animation: blink 1.4s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; background: var(--gold); }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <span class="glyph">✦</span>
    <span class="icon">🔧</span>
    <span class="label">AlCapone Family · Sistema</span>
    <h1 class="title">Sitio en<br>Mantenimiento</h1>
    <div class="rule"></div>
    <p class="text">
      La Famiglia está trabajando entre bastidores para ofrecerte una mejor experiencia. Vuelve en unos momentos.
    </p>
    <div class="firma">AlCapone Family · Est. 2008 · Omertà</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
