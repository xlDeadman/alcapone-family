{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Noticia | AlCapone Family</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0804; font-family: 'Cinzel', serif; color: #f5ead0; }

  .topbar {
    background: rgba(12,10,5,0.95);
    border-bottom: 1px solid rgba(201,168,76,0.1);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .topbar-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.9rem;
    color: #c9a84c;
  }

  .topbar-back {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(245,234,208,0.3);
    text-decoration: none;
    transition: color 0.3s;
  }

  .topbar-back:hover { color: #c9a84c; }

  .wrap {
    max-width: 900px;
    margin: 3rem auto;
    padding: 0 2rem;
  }

  .form-box {
    background: rgba(12,10,5,0.9);
    border: 1px solid rgba(201,168,76,0.1);
    position: relative;
    overflow: hidden;
    padding: 2rem;
  }

  .form-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
  }

  .form-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.2rem;
    color: #c9a84c;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(201,168,76,0.08);
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    color: rgba(201,168,76,0.6);
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.5rem;
  }

  .form-input {
    background: rgba(10,8,4,0.8);
    border: 1px solid rgba(201,168,76,0.15);
    color: #f5ead0;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    padding: 0.8rem 1rem;
    outline: none;
    width: 100%;
    transition: border-color 0.3s;
  }

  .form-input:focus { border-color: rgba(201,168,76,0.4); }

  .form-imagen-actual {
    margin-bottom: 1rem;
  }

  .form-imagen-actual img {
    max-height: 150px;
    border: 1px solid rgba(201,168,76,0.15);
    filter: brightness(0.9);
  }

  .form-imagen-label {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: rgba(245,234,208,0.3);
    display: block;
    margin-bottom: 0.5rem;
  }

  .form-actions {
    display: flex;
    gap: 1rem;
    align-items: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(201,168,76,0.08);
  }

  .btn-guardar {
    padding: 0.7rem 1.8rem;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.3);
    color: #c9a84c;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-guardar:hover { background: #c9a84c; color: #0a0804; }

  .btn-cancelar {
    padding: 0.7rem 1.8rem;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: none;
    border: 1px solid rgba(245,234,208,0.1);
    color: rgba(245,234,208,0.3);
    text-decoration: none;
    transition: all 0.3s;
  }

  .btn-cancelar:hover { border-color: rgba(245,234,208,0.3); color: rgba(245,234,208,0.6); }

  /* ── QUILL ── */
  .ql-toolbar {
    background: rgba(201,168,76,0.06);
    border: 1px solid rgba(201,168,76,0.15) !important;
    border-bottom: none !important;
  }

  .ql-toolbar .ql-stroke { stroke: rgba(201,168,76,0.6); }
  .ql-toolbar .ql-fill { fill: rgba(201,168,76,0.6); }
  .ql-toolbar .ql-picker { color: rgba(201,168,76,0.6); }
  .ql-toolbar .ql-picker-options { background: #0a0804; border: 1px solid rgba(201,168,76,0.2); }
  .ql-toolbar button:hover .ql-stroke { stroke: #c9a84c; }
  .ql-toolbar button:hover .ql-fill { fill: #c9a84c; }

  .ql-container {
    background: rgba(10,8,4,0.8);
    border: 1px solid rgba(201,168,76,0.15) !important;
    min-height: 200px;
  }

  .ql-editor {
    color: #f5ead0;
    font-family: 'IM Fell English', serif;
    font-size: 0.95rem;
    line-height: 1.8;
    min-height: 200px;
  }

  .ql-editor.ql-blank::before {
    color: rgba(245,234,208,0.3);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Editar Noticia</div>
  <a href="/panel/" class="topbar-back">← Volver al Panel</a>
</div>

<div class="wrap">
  <div class="form-box">
    <div class="form-title">✏️ Editando: {{ noticia.titulo }}</div>

    <form id="form-editar" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" value="{{ noticia.titulo }}" required class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Contenido</label>
        <div id="quill-editor"></div>
        <input type="hidden" name="contenido" id="contenido-input">
      </div>

      <div class="form-group">
        <label class="form-label">Imagen</label>
        {% if noticia.imagen %}
        <div class="form-imagen-actual">
          <span class="form-imagen-label">Imagen actual:</span>
          <img src="{{ noticia.imagen.url }}" alt="{{ noticia.titulo }}">
        </div>
        {% endif %}
        <span class="form-imagen-label">Subir nueva imagen (opcional — reemplaza la actual):</span>
        <input type="file" name="imagen" accept="image/*" class="form-input">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-guardar">✓ Guardar Cambios</button>
        <a href="/panel/" class="btn-cancelar">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
  const quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Escribe el contenido de la noticia...',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        [{ 'color': [] }],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        ['link', 'image'],
        ['clean']
      ]
    }
  });

  // Cargar contenido existente
  quill.clipboard.dangerouslyPasteHTML(`{{ noticia.contenido|escapejs }}`);

  document.getElementById('form-editar').addEventListener('submit', function() {
    document.getElementById('contenido-input').value = quill.root.innerHTML;
  });
</script>
</body>
</html>
